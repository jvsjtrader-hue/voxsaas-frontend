<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VoxSaaS - Clonagem de Voz IA</title>
    <style>
        :root { --bg: #f3f4f6; --card: #ffffff; --text: #1f2937; --primary: #4f46e5; --primary-hover: #4338ca; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg); color: var(--text); margin: 0; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { background: var(--card); padding: 30px; border-radius: 12px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 500px; }
        h1 { text-align: center; color: var(--primary); margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #6b7280; font-size: 0.9em; margin-bottom: 25px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9em; }
        input[type="file"], textarea { width: 100%; padding: 10px; border: 1px solid #d1d5db; border-radius: 6px; box-sizing: border-box; font-family: inherit; }
        textarea { resize: vertical; height: 80px; }
        button { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 6px; font-size: 1em; font-weight: bold; cursor: pointer; transition: 0.2s; margin-top: 10px; }
        button:hover { background: var(--primary-hover); }
        button:disabled { background: #9ca3af; cursor: not-allowed; }
        .progress-bar { width: 100%; background: #e5e7eb; border-radius: 4px; height: 8px; margin-top: 15px; display: none; overflow: hidden; }
        .progress-fill { background: var(--primary); height: 100%; width: 0%; transition: width 0.3s ease; }
        .result-box { margin-top: 20px; padding: 15px; background: #ecfdf5; border: 1px solid #10b981; border-radius: 6px; display: none; text-align: center; }
        .result-box a { display: inline-block; padding: 10px 20px; background: #10b981; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 10px; }
        .status { font-size: 0.85em; color: #6b7280; text-align: center; margin-top: 10px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎙️ VoxSaaS</h1>
    <p class="subtitle">Crie áudios realistas clonando qualquer voz.</p>

    <form id="ttsForm">
        <div class="form-group">
            <label for="audioFile">1. Faça upload da voz (5 a 30 segundos):</label>
            <input type="file" id="audioFile" name="file" accept="audio/*" required>
        </div>

        <div class="form-group">
            <label for="transcription">2. Transcrição exata do áudio enviado:</label>
            <textarea id="transcription" name="transcription" placeholder="Digite exatamente o que a voz fala no áudio..." required></textarea>
        </div>

        <div class="form-group">
            <label for="textToGenerate">3. O que a IA deve falar com a voz clonada:</label>
            <textarea id="textToGenerate" name="text_to_generate" placeholder="Digite o texto que deseja sintetizar..." required></textarea>
        </div>

        <button type="submit" id="btnSubmit">Clonar e Gerar Áudio</button>
    </form>

    <div class="progress-bar" id="progressBar">
        <div class="progress-fill" id="progressFill"></div>
    </div>
    <div class="status" id="status"></div>

    <div class="result-box" id="resultBox">
        <h3>✅ Áudio Gerado!</h3>
        <a id="downloadLink" href="#" target="_blank">Baixar Áudio (.wav)</a>
    </div>
</div>

<script>
    const form = document.getElementById('ttsForm');
    const btnSubmit = document.getElementById('btnSubmit');
    const progressBar = document.getElementById('progressBar');
    const progressFill = document.getElementById('progressFill');
    const statusText = document.getElementById('status');
    const resultBox = document.getElementById('resultBox');
    const downloadLink = document.getElementById('downloadLink');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();
        
        // Reseta a UI
        btnSubmit.disabled = true;
        resultBox.style.display = 'none';
        progressBar.style.display = 'block';
        progressFill.style.width = '0%';
        statusText.innerText = 'Enviando arquivos e iniciando processamento...';

        const formData = new FormData(form);

        // Simulação de progresso (já que o backend pode demorar)
        let progress = 0;
        const interval = setInterval(() => {
            if(progress < 90) {
                progress += Math.random() * 5;
                progressFill.style.width = `${progress}%`;
            }
        }, 1000);

        try {
            // Envia para o nosso backend FastAPI
            const response = await fetch('/api/upload', {
                method: 'POST',
                body: formData
            });

            clearInterval(interval);

            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.detail || 'Erro no servidor');
            }

            const data = await response.json();
            
            // Finaliza o progresso
            progressFill.style.width = '100%';
            statusText.innerText = 'Concluído!';
            
            // Mostra o link de download
            downloadLink.href = data.link_download;
            resultBox.style.display = 'block';

        } catch (error) {
            clearInterval(interval);
            progressBar.style.display = 'none';
            statusText.innerHTML = `<span style="color: red;">Erro: ${error.message}</span>`;
        } finally {
            btnSubmit.disabled = false;
        }
    });
</script>
</body>
</html>
